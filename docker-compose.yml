services:
  db:
    image: postgres:16
    container_name: auth_project_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: auth_project_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth_project_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: auth_project_web
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py seed_demo &&
      python manage.py runserver 0.0.0.0:8000
      "

volumes:
  postgres_data: